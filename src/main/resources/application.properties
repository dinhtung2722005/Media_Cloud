# Cấu hình kết nối SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=CloudMediaDrive;encrypt=true;trustServerCertificate=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình Hibernate/JPA (Tự động tạo bảng dựa trên Entity)
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

app.jwt.secret=${APP_JWT_SECRET}

# Bật tính năng multipart (Mặc định là true nhưng cứ khai báo cho chắc)
spring.servlet.multipart.enabled=true

# Storage and external tools (override with environment variables)
app.storage.temp-dir=${APP_STORAGE_TEMP_DIR:./storage/temp}
app.storage.base-dir=${APP_STORAGE_BASE_DIR:./storage/media}
app.tools.ffmpeg=${FFMPEG_PATH:ffmpeg}
app.tools.yt-dlp=${YT_DLP_PATH:yt-dlp}
app.security.secure-cookies=${SECURE_COOKIES:false}

# Legacy single-request upload limit; chunk endpoints accept at most 5 MB per chunk
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=501MB

# Abandoned upload cleanup and per-user temporary storage limits
app.upload.max-active-per-user=${UPLOAD_MAX_ACTIVE_PER_USER:5}
app.upload.max-temp-bytes-per-user=${UPLOAD_MAX_TEMP_BYTES_PER_USER:1073741824}
app.upload.expire-after-ms=${UPLOAD_EXPIRE_AFTER_MS:86400000}
app.upload.cleanup-interval-ms=${UPLOAD_CLEANUP_INTERVAL_MS:3600000}

# External process limits
app.jobs.timeout-seconds=${MEDIA_JOB_TIMEOUT_SECONDS:1800}
app.jobs.youtube-max-bytes=${YOUTUBE_MAX_BYTES:1073741824}


# RabbitMQ AMQP 0-9-1 transport
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.requested-heartbeat=30s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.concurrency=${MEDIA_WORKER_CONCURRENCY:2}
spring.rabbitmq.listener.simple.max-concurrency=${MEDIA_WORKER_CONCURRENCY:2}
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.auto-startup=${MEDIA_WORKER_ENABLED:true}
app.rabbit.retry-max-attempts=${MEDIA_JOB_MAX_ATTEMPTS:2}
app.rabbit.publish-confirm-timeout-ms=${RABBITMQ_CONFIRM_TIMEOUT_MS:5000}

# Redis cache-aside for drive listings; authorization remains backed by SQL Server.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT_MS:500}ms
spring.data.redis.timeout=${REDIS_TIMEOUT_MS:300}ms
spring.data.redis.lettuce.shutdown-timeout=100ms
spring.data.redis.repositories.enabled=false
app.cache.enabled=${REDIS_CACHE_ENABLED:true}
app.cache.drive-ttl-seconds=${REDIS_CACHE_TTL_SECONDS:60}

# Durable workflow, reservations and distributed notifications
app.quota.storage-bytes=${STORAGE_QUOTA_BYTES:21474836480}
app.quota.active-jobs=${ACTIVE_JOBS_PER_USER:10}
app.quota.running-jobs=${RUNNING_JOBS_PER_USER:2}
app.jobs.output-max-bytes=${MEDIA_OUTPUT_MAX_BYTES:1073741824}
app.jobs.lease-seconds=${MEDIA_JOB_LEASE_SECONDS:45}
app.jobs.outbox-poll-ms=1000
app.jobs.recovery-poll-ms=10000
app.storage.reconcile-ms=60000
app.storage.orphan-grace-seconds=${STORAGE_ORPHAN_GRACE_SECONDS:86400}
app.storage.verify-identity=${STORAGE_VERIFY_IDENTITY:true}
app.events.redis-enabled=${REDIS_EVENTS_ENABLED:true}
app.share.default-hours=${SHARE_DEFAULT_HOURS:24}
app.share.max-hours=${SHARE_MAX_HOURS:720}
