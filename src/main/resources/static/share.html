<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Tệp được chia sẻ — CloudMedia</title>
  <link rel="stylesheet" href="/css/share.css">
  <script src="/share.js" defer></script>
</head>
<body>
  <header><a class="brand" href="/">CloudMedia<span>↗</span></a><span class="badge">Được chia sẻ với bạn</span></header>
  <main>
    <section class="share-card" aria-labelledby="share-title">
      <p class="eyebrow">MỘT CHÚT CẢM HỨNG ĐƯỢC GỬI ĐẾN BẠN</p>
      <h1 id="share-title">Đang mở tệp…</h1>
      <p id="share-details" class="muted"></p>
      <div id="share-preview" class="preview" aria-live="polite"><span class="placeholder">Đang kiểm tra liên kết</span></div>
      <p id="share-status" role="status">Vui lòng chờ một chút.</p>
      <a id="share-download" class="button hidden" rel="noreferrer">Tải tệp về</a>
      <p id="share-expiry" class="muted"></p>
    </section>
    <p class="footnote">Nội dung được chủ sở hữu chia sẻ qua CloudMedia.</p>
  </main>
</body>
</html>
